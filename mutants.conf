# Настройки tnt-mutants: мутируют модули пакета, проверки гоняет набор test/.
MUTANTS_SOURCES=(
    ':(glob)tnt/**/*.lua'
    # Упакованная панель — данные, а не код: мутировать таблицу файлов
    # бессмысленно, а прогон по ней занимает минуты.
    ':(exclude)tnt/admin/public/bundle.lua'
    # Страницы `tnt-template` — разметка, а не код. Мутант в разметке —
    # это правка вёрстки, а не поломка правила, и убивать его сверкой
    # страницы по знакам значило бы держать вёрстку в проверках.
    ':(exclude,glob)**/*.thtml.lua'
)
